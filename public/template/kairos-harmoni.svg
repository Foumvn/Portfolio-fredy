<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#1A2A44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B6CEE"/>
      <stop offset="100%" stop-color="#92A4C9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Scanner icon -->
  <rect x="320" y="130" width="160" height="160" rx="12" fill="none" stroke="#2B6CEE" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="130" x2="400" y2="290" stroke="#2B6CEE" stroke-width="1" opacity="0.15"/>
  <line x1="320" y1="210" x2="480" y2="210" stroke="#2B6CEE" stroke-width="1" opacity="0.15"/>
  <!-- QR corners -->
  <path d="M340 150 L340 170 M340 150 L360 150" stroke="#2B6CEE" stroke-width="3" opacity="0.8"/>
  <path d="M460 150 L460 170 M460 150 L440 150" stroke="#2B6CEE" stroke-width="3" opacity="0.8"/>
  <path d="M340 270 L340 250 M340 270 L360 270" stroke="#2B6CEE" stroke-width="3" opacity="0.8"/>
  <path d="M460 270 L460 250 M460 270 L440 270" stroke="#2B6CEE" stroke-width="3" opacity="0.8"/>
  <!-- Scan line -->
  <line x1="335" y1="200" x2="465" y2="200" stroke="#92A4C9" stroke-width="1.5" opacity="0.6">
    <animate attributeName="y1" from="145" to="275" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" from="145" to="275" dur="3s" repeatCount="indefinite"/>
  </line>
  <!-- Document icon -->
  <rect x="370" y="145" width="60" height="75" rx="3" fill="#2B6CEE" opacity="0.1"/>
  <line x1="385" y1="165" x2="415" y2="165" stroke="#92A4C9" stroke-width="2" opacity="0.4"/>
  <line x1="385" y1="178" x2="415" y2="178" stroke="#92A4C9" stroke-width="2" opacity="0.3"/>
  <line x1="385" y1="191" x2="405" y2="191" stroke="#92A4C9" stroke-width="2" opacity="0.2"/>
  <text x="400" y="340" text-anchor="middle" fill="#2B6CEE" font-family="system-ui" font-size="24" font-weight="bold">KAIROS-HARMONI</text>
  <text x="400" y="363" text-anchor="middle" fill="#92A4C9" font-family="system-ui" font-size="13" opacity="0.8">K-Scanner — Gestion de processus et projets</text>
</svg>